# Postgres local. Um serviço só: a fila usa o mesmo banco, em schema próprio.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo
      POSTGRES_DB: kairo
      TZ: America/Sao_Paulo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kairo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev:
