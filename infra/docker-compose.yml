# Compose do VPS. Web e worker no mesmo servidor, sob Coolify.
#
# O estado vive todo no Postgres (Supabase), nao no servidor: se a maquina
# cair, recriar e um `docker compose up -d`.
#
#   IMAGEM_WEB=ghcr.io/utahh/kairo/web:<sha> #   IMAGEM_WORKER=ghcr.io/utahh/kairo/worker:<sha> #     docker compose up -d
services:
  web:
    image: ${IMAGEM_WEB:-ghcr.io/utahh/kairo/web:producao}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ${IMAGEM_WORKER:-ghcr.io/utahh/kairo/worker:producao}
    # on-failure limitado: um worker que reinicia em loop precisa aparecer no
    # painel, nao se esconder atras de um restart infinito.
    restart: on-failure:5
    env_file: [.env]
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      WORKER_PORT: 3001
    ports:
      - '127.0.0.1:3001:3001'
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
