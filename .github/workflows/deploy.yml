name: Deploy

# Só entra em produção o que passou pelo CI. Este workflow não roda sozinho:
# ele espera o CI terminar verde no MESMO commit, e publica exatamente aquele
# SHA — não o topo da branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      alvo:
        description: Ambiente
        required: true
        default: homologacao
        type: choice
        options: [homologacao, producao]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/${{ github.repository }}

jobs:
  # ── Decide para onde vai, e se vai ─────────────────────────────────────────
  decidir:
    name: Onde publicar
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      ambiente: ${{ steps.calcular.outputs.ambiente }}
      sha: ${{ steps.calcular.outputs.sha }}
    steps:
      - id: calcular
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AMBIENTE="${{ inputs.alvo }}"
            SHA="${{ github.sha }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            AMBIENTE="producao"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            AMBIENTE="homologacao"
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Publicando $SHA em $AMBIENTE"

  # ── 1. Banco primeiro. Migration compatível para trás, sempre ─────────────
  #
  # Existe uma janela em que o schema novo convive com o código antigo. É por
  # isso que toda migration precisa ser compatível para trás — e é por isso
  # que o banco sobe antes, e não junto.
  migrar:
    name: Migrations (${{ needs.decidir.outputs.ambiente }})
    needs: decidir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.decidir.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decidir.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Aplicar migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Reaplicar políticas de RLS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/rls.sql

  # ── 2. As duas imagens, com o SHA na tag ──────────────────────────────────
  imagens:
    name: Publicar imagens
    needs: [decidir, migrar]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        alvo: [web, worker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decidir.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Entrar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.alvo }}
          push: true
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.alvo }}:${{ needs.decidir.outputs.sha }}
            ${{ env.REGISTRO }}/${{ matrix.alvo }}:${{ needs.decidir.outputs.ambiente }}
          cache-from: type=gha,scope=${{ matrix.alvo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.alvo }}

  # ── 3. O VPS puxa as imagens novas ────────────────────────────────────────
  vps:
    name: Subir no VPS (${{ needs.decidir.outputs.ambiente }})
    needs: [decidir, imagens]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.decidir.outputs.ambiente }}
    steps:
      - name: Coolify configurado?
        id: coolify
        env:
          GANCHO: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: echo "tem=${{ env.GANCHO != '' }}" >> "$GITHUB_OUTPUT"

      # Caminho 1: Coolify. O painel puxa a imagem e faz a troca.
      - name: Disparar o deploy no Coolify
        if: steps.coolify.outputs.tem == 'true'
        env:
          GANCHO: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$GANCHO" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d '{"tag":"${{ needs.decidir.outputs.sha }}"}'

      - name: SSH configurado?
        id: ssh
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: echo "tem=${{ env.HOST != '' }}" >> "$GITHUB_OUTPUT"

      # Caminho 2: docker compose direto, para quem não usa o painel.
      - name: Subir por SSH
        if: steps.coolify.outputs.tem != 'true' && steps.ssh.outputs.tem == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGEM_WEB=${{ env.REGISTRO }}/web:${{ needs.decidir.outputs.sha }}
            export IMAGEM_WORKER=${{ env.REGISTRO }}/worker:${{ needs.decidir.outputs.sha }}
            docker compose pull
            docker compose up -d
            docker image prune -f
            sleep 8
            curl -fsS http://127.0.0.1:3000/api/healthz
            curl -fsS http://127.0.0.1:3001/healthz

      - name: Nada configurado ainda
        if: steps.coolify.outputs.tem != 'true' && steps.ssh.outputs.tem != 'true'
        run: |
          echo "::notice::Imagens publicadas no GHCR com a tag ${{ needs.decidir.outputs.sha }}."
          echo "::notice::Configure COOLIFY_WEBHOOK_URL (ou VPS_HOST/VPS_USER/VPS_SSH_KEY/VPS_PATH) para o deploy automático."

  # ── 4. A sonda externa é quem diz que subiu ───────────────────────────────
  sonda:
    name: Sonda pública
    needs: [decidir, vps]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.decidir.outputs.ambiente }}
    steps:
      - name: Conferir /api/healthz
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::Sem APP_URL configurada — sonda pulada."
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -fsS "$APP_URL/api/healthz" > /dev/null; then
              echo "Web respondendo em $APP_URL."
              exit 0
            fi
            sleep 6
          done
          echo "::error::A sonda $APP_URL/api/healthz não respondeu."
          exit 1
