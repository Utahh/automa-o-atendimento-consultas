name: Deploy

# Só entra em produção o que passou pelo CI. Este workflow não roda sozinho:
# ele espera o CI terminar verde no mesmo commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      alvo:
        description: Ambiente
        required: true
        default: homologacao
        type: choice
        options: [homologacao, producao]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Decide para onde vai, e se vai ─────────────────────────────────────────
  decidir:
    name: Onde publicar
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      ambiente: ${{ steps.calcular.outputs.ambiente }}
      sha: ${{ steps.calcular.outputs.sha }}
      producao: ${{ steps.calcular.outputs.producao }}
    steps:
      - id: calcular
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AMBIENTE="${{ inputs.alvo }}"
            SHA="${{ github.sha }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            AMBIENTE="producao"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            AMBIENTE="homologacao"
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          [ "$AMBIENTE" = "producao" ] && echo "producao=true" >> "$GITHUB_OUTPUT" || echo "producao=false" >> "$GITHUB_OUTPUT"
          echo "Publicando $SHA em $AMBIENTE"

  # ── 1. Banco primeiro. Migration compatível para trás, sempre ─────────────
  migrar:
    name: Migrations (${{ needs.decidir.outputs.ambiente }})
    needs: decidir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.decidir.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decidir.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Aplicar migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Reaplicar políticas de RLS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/rls.sql

  # ── 2. Web na Vercel ──────────────────────────────────────────────────────
  web:
    name: Web (${{ needs.decidir.outputs.ambiente }})
    needs: [decidir, migrar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.decidir.outputs.ambiente }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decidir.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm i -g vercel@latest

      - name: Puxar configuração
        run: vercel pull --yes --environment=${{ needs.decidir.outputs.producao == 'true' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ needs.decidir.outputs.producao == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Publicar
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ needs.decidir.outputs.producao == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Publicado em $URL"

      - name: Sonda do web
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ steps.deploy.outputs.url }}/api/healthz" > /dev/null; then
              echo "Web respondendo."; exit 0
            fi
            sleep 6
          done
          echo "::error::A sonda /api/healthz não respondeu."
          exit 1

  # ── 3. Worker: imagem no GHCR e docker compose no VPS ─────────────────────
  worker:
    name: Worker (${{ needs.decidir.outputs.ambiente }})
    needs: [decidir, migrar]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.decidir.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decidir.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ needs.decidir.outputs.sha }}
            ghcr.io/${{ github.repository }}/worker:${{ needs.decidir.outputs.ambiente }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Segredos de SSH presentes?
        id: ssh
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: echo "tem=${{ env.HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Subir no VPS
        if: steps.ssh.outputs.tem == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGEM_WORKER=ghcr.io/${{ github.repository }}/worker:${{ needs.decidir.outputs.sha }}
            docker compose pull worker
            docker compose up -d --no-deps worker
            docker image prune -f
            sleep 5
            curl -fsS http://127.0.0.1:3001/healthz

      - name: Sem SSH configurado
        if: steps.ssh.outputs.tem != 'true'
        run: echo "::notice::Imagem publicada no GHCR. Configure VPS_HOST, VPS_USER, VPS_SSH_KEY e VPS_PATH para o deploy automático."
