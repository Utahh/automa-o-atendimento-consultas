name: Preview

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  vercel:
    name: Publicar preview na Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sem os segredos configurados, o passo é pulado em vez de falhar vermelho.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Segredos presentes?
        id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "tem=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Sem segredos da Vercel — nada a publicar
        if: steps.check.outputs.tem != 'true'
        run: echo "::notice::Configure VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID para ligar o preview."

      - name: Instalar a CLI
        if: steps.check.outputs.tem == 'true'
        run: npm i -g vercel@latest

      - name: Puxar a configuração do projeto
        if: steps.check.outputs.tem == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        if: steps.check.outputs.tem == 'true'
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Publicar
        id: deploy
        if: steps.check.outputs.tem == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comentar a URL no PR
        if: steps.check.outputs.tem == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marca = '<!-- preview-kairo -->';
            const corpo = `${marca}\n**Preview publicado:** ${url}\n\nAbra em 320 px antes de aprovar.`;
            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existente = comentarios.find((c) => c.body?.includes(marca));
            if (existente) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existente.id, body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: corpo,
              });
            }
