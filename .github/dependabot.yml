version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [dependencias]
    groups:
      # Um PR por família: menos ruído, menos revisão repetida.
      react-e-next:
        patterns:
          ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
      ferramentas:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*', 'vitest', '@vitejs/*']
      banco:
        patterns: ['drizzle*', 'pg', '@types/pg', 'pg-boss']
      patches:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias, ci]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    labels: [dependencias, infra]
